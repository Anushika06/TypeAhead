spring:
  application:
    name: typeahead

  datasource:
    url: jdbc:postgresql://localhost:5432/typeahead
    username: postgres
    password: mn@h_2006
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms

# ── Application-level cache settings ──────────────────────────────────────────
cache:
  redis:
    # How long a prefix ZSET lives in Redis before expiring.
    # On expiry the next /suggest call will be a cache miss → PostgreSQL fallback.
    ttl-minutes: 60

# ── Scheduler settings ────────────────────────────────────────────────────────
scheduler:
  decay:
    # Cron expression for trend score decay (Spring 6-field format: s m h d M wd).
    # Development : every 1 minute  → "0 * * * * *"
    # Production  : nightly at 2 AM → "0 0 2 * * *"
    cron: "0 0 2 * * *"
